<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>かずのぶんかい・　ごうせい</title>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* タッチデバイスでの意図しない画面揺れを防ぐ */
        body {
            touch-action: manipulation;
            font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
            background-color: #f7f9fa;
        }
        /* ゆったりしたアニメーション */
        .bounce-animation {
            animation: bounce 0.5s ease infinite alternate;
        }
        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-8px); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 md:p-6 select-none">

    <!-- ヘッダー -->
    <header class="w-full max-w-4xl text-center my-2">
        <h1 class="text-3xl md:text-4xl font-black text-indigo-600 tracking-wider">
            🎈 かずのぶんかいとごうせい 🎈
        </h1>
        <p class="text-sm md:text-base text-gray-500 mt-1">
            おはじきを 動かしたり タップして あそぼう！
        </p>
    </header>

    <!-- メインコンテンツ -->
    <main class="w-full max-w-4xl bg-white rounded-3xl shadow-xl p-4 md:p-8 flex flex-col gap-6 flex-grow">
        
        <!-- モード選択 & 目標数選択 -->
        <div class="flex flex-wrap items-center justify-between gap-4 border-b pb-4">
            <!-- 学習モード切り替え -->
            <div class="flex bg-slate-100 p-1 rounded-2xl w-full sm:w-auto">
                <button id="btn-mode-split" onclick="changeMode('split')" class="flex-1 sm:flex-initial px-5 py-2.5 rounded-xl font-bold text-sm transition-all bg-indigo-600 text-white shadow-md">
                    ✂️ いくつといくつ (分解)
                </button>
                <button id="btn-mode-merge" onclick="changeMode('merge')" class="flex-1 sm:flex-initial px-5 py-2.5 rounded-xl font-bold text-sm transition-all text-slate-600 hover:text-indigo-600">
                    🤝 あわせていくつ (合成)
                </button>
            </div>

            <!-- ターゲット数（レベル） -->
            <div class="flex items-center gap-2 overflow-x-auto py-1 w-full sm:w-auto scrollbar-none">
                <span class="text-sm font-bold text-slate-600 whitespace-nowrap">いくつにする？</span>
                <div class="flex gap-1">
                    <button class="target-btn px-4 py-2 bg-indigo-100 hover:bg-indigo-200 text-indigo-700 rounded-lg font-bold text-lg active:scale-95 transition-transform" onclick="setTargetNumber(5)">5</button>
                    <button class="target-btn px-4 py-2 bg-indigo-100 hover:bg-indigo-200 text-indigo-700 rounded-lg font-bold text-lg active:scale-95 transition-transform" onclick="setTargetNumber(6)">6</button>
                    <button class="target-btn px-4 py-2 bg-indigo-100 hover:bg-indigo-200 text-indigo-700 rounded-lg font-bold text-lg active:scale-95 transition-transform" onclick="setTargetNumber(7)">7</button>
                    <button class="target-btn px-4 py-2 bg-indigo-100 hover:bg-indigo-200 text-indigo-700 rounded-lg font-bold text-lg active:scale-95 transition-transform" onclick="setTargetNumber(8)">8</button>
                    <button class="target-btn px-4 py-2 bg-indigo-100 hover:bg-indigo-200 text-indigo-700 rounded-lg font-bold text-lg active:scale-95 transition-transform" onclick="setTargetNumber(9)">9</button>
                    <button class="target-btn px-4 py-2 bg-indigo-600 text-white rounded-lg font-bold text-xl scale-105 active:scale-95 transition-transform" id="btn-target-10" onclick="setTargetNumber(10)">10</button>
                </div>
            </div>
        </div>

        <!-- 式表示エリア -->
        <div class="flex items-center justify-center gap-4 text-4xl md:text-6xl font-black text-slate-700 bg-amber-50 rounded-2xl py-6 border-2 border-amber-200 shadow-inner">
            <!-- 分解モード: 10 は [ ] と 4 -->
            <!-- 合成モード: [ ] と 4 で 10 -->
            <div id="formula-container" class="flex items-center justify-center gap-3 md:gap-6 flex-wrap">
                <!-- 動的に書き換えられます -->
            </div>
        </div>

        <!-- おはじき操作エリア（一番直感的で大事な場所） -->
        <div class="flex flex-col items-center bg-slate-50 p-4 rounded-2xl border border-slate-200">
            <p class="text-sm text-slate-500 font-bold mb-3" id="hint-text">
                おはじきを タップして べつのおさらに うつしてみよう！
            </p>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full">
                <!-- 左側のお皿 / あるいは元のお皿 -->
                <div id="plate-left" class="bg-blue-50 border-4 border-dashed border-blue-200 rounded-2xl p-4 min-h-[160px] flex flex-wrap gap-3 items-center justify-center transition-all">
                    <!-- おはじきが入ります -->
                </div>

                <!-- 右側のお皿 / 分かれた先のお皿 -->
                <div id="plate-right" class="bg-rose-50 border-4 border-dashed border-rose-200 rounded-2xl p-4 min-h-[160px] flex flex-wrap gap-3 items-center justify-center transition-all">
                    <!-- おはじきが入ります -->
                </div>
            </div>

            <!-- お皿ごとの数を可視化 -->
            <div class="grid grid-cols-2 gap-6 w-full text-center mt-2 text-xl font-extrabold text-slate-500">
                <div>あおい おさら: <span id="count-left" class="text-blue-600 text-3xl">0</span></div>
                <div>あかい おさら: <span id="count-right" class="text-rose-600 text-3xl">0</span></div>
            </div>
        </div>

        <!-- 回答エリア（数字カードを選択する） -->
        <div class="flex flex-col items-center gap-3">
            <span class="text-lg font-bold text-slate-600" id="choice-label">あてはまる すうじを えらんでね！</span>
            <div id="choices-container" class="flex flex-wrap justify-center gap-3">
                <!-- すうじボタンが自動生成されます -->
            </div>
        </div>

        <!-- フィードバック・お祝いメッセージ -->
        <div id="feedback-panel" class="hidden text-center p-4 bg-emerald-50 border border-emerald-200 rounded-2xl">
            <p id="feedback-text" class="text-2xl md:text-3xl font-extrabold text-emerald-600 bounce-animation">
                🎉 せいかい！ すごいね！ 🎉
            </p>
        </div>

    </main>

    <!-- フッター -->
    <footer class="w-full text-center py-4 text-xs text-gray-400">
        ボタンを押すと 音がでます。音量を調節して遊んでね。
    </footer>

    <!-- スクリプト -->
    <script>
        // --- 状態管理 ---
        let currentMode = 'split'; // 'split' (分解) or 'merge' (合成)
        let targetNumber = 10;      // 目標の数字
        let leftCount = 0;         // 左側のお皿のおはじき数
        let rightCount = 0;        // 右側のお皿のおはじき数
        let questionValue = 0;     // 出題に使う基準値
        let hidePosition = 'left';  // 隠す部分 ('left' = ひだり, 'right' = みぎ, 'target' = 合成時の目標)
        let correctAnswer = 0;     // 正解の数字
        let isSolved = false;      // 正解済みかどうか

        // --- Web Audio API による優しい電子音 ---
        let audioCtx = null;
        function playTone(freq, duration, type = 'sine') {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = type;
                osc.frequency.value = freq;
                
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                // 滑らかに音を消す
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {
                console.log("Audio play blocked or unsupported");
            }
        }

        function playSuccessSound() {
            playTone(523.25, 0.15, 'triangle'); // ド
            setTimeout(() => playTone(659.25, 0.15, 'triangle'), 100); // ミ
            setTimeout(() => playTone(783.99, 0.15, 'triangle'), 200); // ソ
            setTimeout(() => playTone(1046.50, 0.3, 'triangle'), 300); // 高いド
        }

        function playWrongSound() {
            playTone(330, 0.15, 'sine'); // ミー
            setTimeout(() => playTone(290, 0.3, 'sine'), 120); // レー
        }

        function playPopSound() {
            playTone(800, 0.05, 'sine');
        }

        // --- 音声合成（Web Speech API） ---
        function speakText(text) {
            if ('speechSynthesis' in window) {
                // 実行中の音声をキャンセル
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ja-JP';
                utterance.rate = 1.0; // ゆっくり
                utterance.pitch = 1.1; // やや高めで聴きやすく
                window.speechSynthesis.speak(utterance);
            }
        }

        // --- 初期化と設定の更新 ---
        window.onload = () => {
            setTargetNumber(10); // デフォルト10
        };

        function setTargetNumber(num) {
            targetNumber = num;
            // ボタンのアクティブ状態を変更
            document.querySelectorAll('.target-btn').forEach(btn => {
                btn.className = "target-btn px-4 py-2 bg-indigo-100 hover:bg-indigo-200 text-indigo-700 rounded-lg font-bold text-lg active:scale-95 transition-transform";
            });
            event.target.className = "target-btn px-5 py-2.5 bg-indigo-600 text-white rounded-lg font-bold text-xl scale-105 active:scale-95 transition-transform shadow-md";
            
            initGame();
        }

        function changeMode(mode) {
            currentMode = mode;
            const btnSplit = document.getElementById('btn-mode-split');
            const btnMerge = document.getElementById('btn-mode-merge');
            
            if (mode === 'split') {
                btnSplit.className = "flex-1 sm:flex-initial px-5 py-2.5 rounded-xl font-bold text-sm transition-all bg-indigo-600 text-white shadow-md";
                btnMerge.className = "flex-1 sm:flex-initial px-5 py-2.5 rounded-xl font-bold text-sm transition-all text-slate-600 hover:text-indigo-600";
            } else {
                btnMerge.className = "flex-1 sm:flex-initial px-5 py-2.5 rounded-xl font-bold text-sm transition-all bg-indigo-600 text-white shadow-md";
                btnSplit.className = "flex-1 sm:flex-initial px-5 py-2.5 rounded-xl font-bold text-sm transition-all text-slate-600 hover:text-indigo-600";
            }
            initGame();
        }

        // --- ゲームの構築 ---
        function initGame() {
            isSolved = false;
            document.getElementById('feedback-panel').classList.add('hidden');
            
            // 問題となるお皿の数をセット
            // 分解：おはじきの総数は targetNumber に固定。左右をランダムに分ける
            // 合成：おはじきの総数は targetNumber に固定。左右をランダムに分ける
            leftCount = Math.floor(Math.random() * (targetNumber - 1)) + 1; // 1以上 target-1以下
            rightCount = targetNumber - leftCount;

            // 隠す部分（クイズ）の決定
            if (currentMode === 'split') {
                // 分解モード：左か右のどちらか一方を隠す
                hidePosition = Math.random() > 0.5 ? 'left' : 'right';
                correctAnswer = (hidePosition === 'left') ? leftCount : rightCount;
            } else {
                // 合成モード：目標数か、左右のどこかを隠す
                const r = Math.random();
                if (r < 0.4) {
                    hidePosition = 'target'; // 合計値を当てる
                    correctAnswer = targetNumber;
                } else if (r < 0.7) {
                    hidePosition = 'left';
                    correctAnswer = leftCount;
                } else {
                    hidePosition = 'right';
                    correctAnswer = rightCount;
                }
            }

            renderFormula();
            renderPlates();
            renderChoices();
            announceQuestion();
        }

        // --- 数式表示の更新 ---
        function renderFormula() {
            const container = document.getElementById('formula-container');
            container.innerHTML = '';

            if (currentMode === 'split') {
                // [全体(target)] は [左] と [右]
                const tBox = createNumBox(targetNumber, false);
                const isWord = createWordSpan('は');
                const lBox = createNumBox(leftCount, hidePosition === 'left');
                const andWord = createWordSpan('と');
                const rBox = createNumBox(rightCount, hidePosition === 'right');

                container.appendChild(tBox);
                container.appendChild(isWord);
                container.appendChild(lBox);
                container.appendChild(andWord);
                container.appendChild(rBox);
            } else {
                // [左] と [右] で [全体(target)]
                const lBox = createNumBox(leftCount, hidePosition === 'left');
                const andWord = createWordSpan('と');
                const rBox = createNumBox(rightCount, hidePosition === 'right');
                const doneWord = createWordSpan('で');
                const tBox = createNumBox(targetNumber, hidePosition === 'target');

                container.appendChild(lBox);
                container.appendChild(andWord);
                container.appendChild(rBox);
                container.appendChild(doneWord);
                container.appendChild(tBox);
            }
        }

        function createNumBox(value, isHidden) {
            const box = document.createElement('div');
            box.className = "flex items-center justify-center px-6 py-4 rounded-2xl min-w-[80px] h-[80px] shadow-sm font-black text-5xl transition-all duration-300";
            if (isHidden) {
                box.id = "missing-box";
                box.className += " bg-yellow-100 border-4 border-dashed border-yellow-400 text-yellow-600 animate-pulse cursor-pointer";
                box.textContent = "？";
            } else {
                box.className += " bg-white border-2 border-slate-300 text-slate-800";
                box.textContent = value;
            }
            return box;
        }

        function createWordSpan(text) {
            const span = document.createElement('span');
            span.className = "text-2xl md:text-3xl text-slate-500 font-bold mx-1";
            span.textContent = text;
            return span;
        }

        // --- おはじきお皿の更新（ドラッグ操作のシミュレートタップ含む） ---
        function renderPlates() {
            const plateLeft = document.getElementById('plate-left');
            const plateRight = document.getElementById('plate-right');
            const countLeftSpan = document.getElementById('count-left');
            const countRightSpan = document.getElementById('count-right');

            plateLeft.innerHTML = '';
            plateRight.innerHTML = '';

            countLeftSpan.textContent = leftCount;
            countRightSpan.textContent = rightCount;

            // 左側のおはじき（青い星）
            for (let i = 0; i < leftCount; i++) {
                const bead = createBead('blue', 'left');
                plateLeft.appendChild(bead);
            }

            // 右側のおはじき（赤いりんご）
            for (let i = 0; i < rightCount; i++) {
                const bead = createBead('red', 'right');
                plateRight.appendChild(bead);
            }
        }

        function createBead(color, currentPlate) {
            const bead = document.createElement('button');
            bead.className = "w-14 h-14 md:w-16 md:h-16 flex items-center justify-center text-4xl rounded-full shadow-md active:scale-95 transition-transform duration-100 focus:outline-none";
            
            if (color === 'blue') {
                bead.textContent = '⭐';
                bead.className += " bg-blue-100 border-2 border-blue-400 hover:bg-blue-200";
            } else {
                bead.textContent = '🍎';
                bead.className += " bg-rose-100 border-2 border-rose-400 hover:bg-rose-200";
            }

            // タップでおはじきを別のお皿に移す（一番簡単で間違いのない移動方法）
            bead.onclick = () => {
                if (isSolved) return;
                playPopSound();
                if (currentPlate === 'left') {
                    leftCount--;
                    rightCount++;
                } else {
                    leftCount++;
                    rightCount--;
                }
                
                // 数式とお皿をリアルタイム更新
                renderPlates();
                // ※ 現在のクイズの正解が「ユーザーがおはじきをどうわけたか」に引っ張られると混乱するため、
                // 問題作成時に決定した correctAnswer と比べるための基準値が変更されているかを自動判定。
                // 児童がおはじきを操作して答えを探せるように、式を再表示
                renderFormula();
            };

            return bead;
        }

        // --- 選択肢ボタンの自動生成 ---
        function renderChoices() {
            const container = document.getElementById('choices-container');
            container.innerHTML = '';

            // 0から targetNumber までのボタンを出す
            for (let i = 0; i <= targetNumber; i++) {
                const btn = document.createElement('button');
                btn.className = "w-16 h-16 md:w-20 md:h-20 bg-amber-400 hover:bg-amber-500 text-slate-800 text-3xl font-extrabold rounded-2xl shadow-md border-b-4 border-amber-600 active:border-b-0 active:translate-y-1 transition-all flex items-center justify-center";
                btn.textContent = i;
                btn.onclick = () => selectAnswer(i);
                container.appendChild(btn);
            }
        }

        // --- 音声解説文の生成と再生 ---
        function announceQuestion() {
            let message = "";
            if (currentMode === 'split') {
                if (hidePosition === 'left') {
                    message = `${targetNumber}は、いくつと、${rightCount}かな？`;
                } else {
                    message = `${targetNumber}は、${leftCount}と、いくつかな？`;
                }
            } else {
                if (hidePosition === 'target') {
                    message = `${leftCount}と、${rightCount}を あわせると、いくつかな？`;
                } else if (hidePosition === 'left') {
                    message = `いくつと、${rightCount}を あわせたら、${targetNumber}に なるかな？`;
                } else {
                    message = `${leftCount}と、いくつを あわせたら、${targetNumber}に なるかな？`;
                }
            }
            speakText(message);
        }

        // --- 判定処理 ---
        function selectAnswer(num) {
            if (isSolved) return;

            if (num === correctAnswer) {
                handleCorrect();
            } else {
                handleIncorrect();
            }
        }

        function handleCorrect() {
            isSolved = true;
            playSuccessSound();

            // 数式の？ボックスを正解の数字に書き換え
            const missingBox = document.getElementById('missing-box');
            if (missingBox) {
                missingBox.textContent = correctAnswer;
                missingBox.className = "flex items-center justify-center px-6 py-4 rounded-2xl min-w-[80px] h-[80px] shadow-sm font-black text-5xl bg-emerald-100 border-4 border-emerald-400 text-emerald-600";
            }

            // お祝い表示
            const feedbackPanel = document.getElementById('feedback-panel');
            const feedbackText = document.getElementById('feedback-text');
            feedbackPanel.classList.remove('hidden');

            let congratulationText = "";
            if (currentMode === 'split') {
                congratulationText = `せいかい！ ${targetNumber} は ${leftCount} と ${rightCount} に わけられるね！`;
            } else {
                congratulationText = `せいかい！ ${leftCount} と ${rightCount} を あわせると ${targetNumber} だね！`;
            }

            feedbackText.textContent = `🎉 せいかい！ ${leftCount} と ${rightCount} で ${targetNumber}！ 🎉`;
            speakText(congratulationText);

            // 3.5秒後に次の問題へ
            setTimeout(() => {
                initGame();
            }, 3500);
        }

        function handleIncorrect() {
            playWrongSound();
            speakText("ちがうよ、もう一回考えてみてね");
            
            // ちょっとした揺れるアニメーションを式に入れる
            const missingBox = document.getElementById('missing-box');
            if (missingBox) {
                missingBox.classList.add('bg-rose-100', 'border-rose-400', 'text-rose-600');
                setTimeout(() => {
                    missingBox.classList.remove('bg-rose-100', 'border-rose-400', 'text-rose-600');
                }, 800);
            }
        }
    </script>
</body>
</html>

```
