<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>かずのごうせいぶんかい</title>
    <meta name="theme-color" content="#4f46e5">
    <meta name="description" content="おはじきを数えて、数の合成と分解を楽しく学ぶアプリです。">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="かずのがくしゅう">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" type="image/png" href="./icons/icon-192.png">
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
    <link rel="stylesheet" href="./styles.css">
    <script src="./pwa.js" defer></script>
    <style>
        /* タッチデバイスでの不要なスクロールや拡大縮小のズレを防止 */
        body {
            touch-action: manipulation;
            font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
            background-color: #f4f9fc;
        }
        /* 正解時のアニメーション */
        .bounce-animation {
            animation: bounce 0.5s ease infinite alternate;
        }
        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-8px); }
        }
        /* タップした時におはじきが少し弾むアニメーション */
        .pop-active {
            animation: popIcon 0.15s ease-out;
        }
        @keyframes popIcon {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-3 md:p-6 select-none">

    <!-- ヘッダーと最大化ボタン -->
    <header class="w-full max-w-4xl flex items-center justify-between my-2 px-2">
        <div class="text-left">
            <h1 class="text-2xl md:text-4xl font-black text-indigo-600 tracking-wider">
                🎈 かずの ごうせい と ぶんかい 🎈
            </h1>
            <p class="text-xs md:text-sm text-gray-500 mt-1">
                おはじきを １、２、３ と かぞえてみよう！
            </p>
        </div>
        
        <!-- 全画面表示切り替えボタン -->
        <button id="btn-fullscreen" onclick="toggleFullscreen()" class="flex items-center gap-2 px-4 py-2.5 bg-white border-2 border-slate-300 hover:border-indigo-400 text-slate-700 hover:text-indigo-600 rounded-xl font-bold text-sm shadow-sm active:scale-95 transition-all">
            <span id="fs-icon">🖥️</span>
            <span id="fs-text">がめんを おおきくする</span>
        </button>
    </header>

    <section class="pwa-tools" aria-label="アプリの設定">
        <p id="pwa-status" role="status" aria-live="polite">オフラインの準備をしています…</p>
        <div class="pwa-actions">
            <button id="pwa-install" type="button" hidden>ホーム画面に追加</button>
            <button id="pwa-update" type="button" hidden>最新版に更新</button>
            <details id="pwa-help">
                <summary>ホーム画面に追加する方法</summary>
                <p>iPhone・iPad：Safariの共有メニューから「ホーム画面に追加」を選びます。<br>
                Android・パソコン：ブラウザーのメニューから「アプリをインストール」などを選びます。</p>
            </details>
        </div>
    </section>

    <!-- メインコンテンツ -->
    <main class="w-full max-w-4xl bg-white rounded-3xl shadow-xl p-4 md:p-8 flex flex-col gap-5 flex-grow">
        
        <!-- モード選択 & 目標数選択 -->
        <div class="flex flex-wrap items-center justify-between gap-4 border-b pb-4">
            <!-- 学習モード切り替え -->
            <div class="flex bg-slate-100 p-1 rounded-2xl w-full sm:w-auto">
                <button id="btn-mode-split" onclick="changeMode('split')" class="flex-1 sm:flex-initial px-5 py-2.5 rounded-xl font-bold text-sm transition-all bg-indigo-600 text-white shadow-md">
                    ✂️ いくつといくつ (ぶんかい)
                </button>
                <button id="btn-mode-merge" onclick="changeMode('merge')" class="flex-1 sm:flex-initial px-5 py-2.5 rounded-xl font-bold text-sm transition-all text-slate-600 hover:text-indigo-600">
                    🤝 あわせていくつ (ごうせい)
                </button>
            </div>

            <!-- ターゲット数（レベル） -->
            <div class="flex items-center gap-2 overflow-x-auto py-1 w-full sm:w-auto scrollbar-none">
                <span class="text-sm font-bold text-slate-600 whitespace-nowrap">いくつかぞえる？</span>
                <div class="flex gap-1">
                    <button class="target-btn px-4 py-2 bg-indigo-100 hover:bg-indigo-200 text-indigo-700 rounded-lg font-bold text-lg active:scale-95 transition-transform" onclick="setTargetNumber(5)">5</button>
                    <button class="target-btn px-4 py-2 bg-indigo-100 hover:bg-indigo-200 text-indigo-700 rounded-lg font-bold text-lg active:scale-95 transition-transform" onclick="setTargetNumber(6)">6</button>
                    <button class="target-btn px-4 py-2 bg-indigo-100 hover:bg-indigo-200 text-indigo-700 rounded-lg font-bold text-lg active:scale-95 transition-transform" onclick="setTargetNumber(7)">7</button>
                    <button class="target-btn px-4 py-2 bg-indigo-100 hover:bg-indigo-200 text-indigo-700 rounded-lg font-bold text-lg active:scale-95 transition-transform" onclick="setTargetNumber(8)">8</button>
                    <button class="target-btn px-4 py-2 bg-indigo-100 hover:bg-indigo-200 text-indigo-700 rounded-lg font-bold text-lg active:scale-95 transition-transform" onclick="setTargetNumber(9)">9</button>
                    <button class="target-btn px-6 py-2 bg-indigo-600 text-white rounded-lg font-bold text-xl scale-105 active:scale-95 transition-transform" id="btn-target-10" onclick="setTargetNumber(10)">10</button>
                </div>
            </div>
        </div>

        <!-- 式表示エリア -->
        <div class="flex items-center justify-center gap-4 text-4xl md:text-6xl font-black text-slate-700 bg-amber-50 rounded-2xl py-6 border-2 border-amber-200 shadow-inner">
            <div id="formula-container" class="flex items-center justify-center gap-2 md:gap-5 flex-wrap">
                <!-- 動的に数式が生成されます -->
            </div>
        </div>

        <!-- おはじき表示エリア -->
        <div class="flex flex-col items-center bg-slate-50 p-6 rounded-2xl border border-slate-200">
            <p class="text-sm text-slate-500 font-bold mb-4" id="hint-text">
                おはじきを タップすると ぽん！と はねるよ。かぞえてみよう！
            </p>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full">
                <!-- 左側のお皿 -->
                <div class="flex flex-col items-center">
                    <span class="text-sm font-bold text-blue-500 mb-1">あおい おさら</span>
                    <div id="plate-left" class="w-full bg-blue-50 border-4 border-dashed border-blue-200 rounded-2xl p-4 min-h-[160px] flex flex-wrap gap-3 items-center justify-center">
                        <!-- おはじきが固定で並びます -->
                    </div>
                </div>

                <!-- 右側のお皿 -->
                <div class="flex flex-col items-center">
                    <span class="text-sm font-bold text-rose-500 mb-1">あかい おさら</span>
                    <div id="plate-right" class="w-full bg-rose-50 border-4 border-dashed border-rose-200 rounded-2xl p-4 min-h-[160px] flex flex-wrap gap-3 items-center justify-center">
                        <!-- おはじきが固定で並びます -->
                    </div>
                </div>
            </div>
        </div>

        <!-- 回答エリア（数字カードを選択する） -->
        <div class="flex flex-col items-center gap-3">
            <span class="text-lg font-bold text-slate-600" id="choice-label">？ にはいる すうじを えらんでね！</span>
            <div id="choices-container" class="flex flex-wrap justify-center gap-3">
                <!-- すうじボタンが自動生成されます -->
            </div>
        </div>

        <!-- フィードバック・お祝いメッセージ -->
        <div id="feedback-panel" class="hidden text-center p-4 bg-emerald-50 border border-emerald-200 rounded-2xl">
            <p id="feedback-text" class="text-2xl md:text-3xl font-extrabold text-emerald-600 bounce-animation">
                🎉 せいかい！ すごいね！ 🎉
            </p>
        </div>

    </main>

    <!-- フッター -->
    <footer class="w-full text-center py-4 text-xs text-gray-400">
        ボタンを押すと 音がでます。音量を調節して遊んでね。
    </footer>

    <!-- スクリプト -->
    <script>
        // --- 状態管理 ---
        let currentMode = 'split'; // 'split' (分解) or 'merge' (合成)
        let targetNumber = 10;      // 目標の数字
        let leftCount = 0;         // 左側のお皿のおはじき数
        let rightCount = 0;        // 右側のお皿のおはじき数
        let hidePosition = 'left';  // 隠す部分 ('left', 'right', 'target')
        let correctAnswer = 0;     // 正解の数字
        let isSolved = false;      // 正解済みかどうか

        // --- Web Audio API による優しい電子音 ---
        let audioCtx = null;
        function playTone(freq, duration, type = 'sine') {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = type;
                osc.frequency.value = freq;
                
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {
                console.log("Audio play blocked");
            }
        }

        function playSuccessSound() {
            playTone(523.25, 0.15, 'triangle'); // ド
            setTimeout(() => playTone(659.25, 0.15, 'triangle'), 100); // ミ
            setTimeout(() => playTone(783.99, 0.15, 'triangle'), 200); // ソ
            setTimeout(() => playTone(1046.50, 0.35, 'triangle'), 300); // 高いド
        }

        function playWrongSound() {
            playTone(330, 0.15, 'sine'); // ミー
            setTimeout(() => playTone(290, 0.3, 'sine'), 120); // レー
        }

        function playPopSound() {
            // おはじきを数えるときの軽快なポッという音
            playTone(900, 0.08, 'sine');
        }

        // --- 音声合成（Web Speech API） ---
        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ja-JP';
                utterance.rate = 1.0; // 聞き取りやすい標準速度
                utterance.pitch = 1.1; // 少し明るい声色
                window.speechSynthesis.speak(utterance);
            }
        }

        // --- 初期設定 ---
        window.onload = () => {
            setTargetNumber(10); // 初期値は10
        };

        function setTargetNumber(num) {
            targetNumber = num;
            document.querySelectorAll('.target-btn').forEach(btn => {
                btn.className = "target-btn px-4 py-2 bg-indigo-100 hover:bg-indigo-200 text-indigo-700 rounded-lg font-bold text-lg active:scale-95 transition-transform";
            });
            const selectedButton = Array.from(document.querySelectorAll('.target-btn'))
                .find(btn => Number(btn.textContent) === num);
            if (selectedButton) selectedButton.className = "target-btn px-6 py-2 bg-indigo-600 text-white rounded-lg font-bold text-xl scale-105 active:scale-95 transition-transform shadow-md";
            
            initGame();
        }

        function changeMode(mode) {
            currentMode = mode;
            const btnSplit = document.getElementById('btn-mode-split');
            const btnMerge = document.getElementById('btn-mode-merge');
            
            if (mode === 'split') {
                btnSplit.className = "flex-1 sm:flex-initial px-5 py-2.5 rounded-xl font-bold text-sm transition-all bg-indigo-600 text-white shadow-md";
                btnMerge.className = "flex-1 sm:flex-initial px-5 py-2.5 rounded-xl font-bold text-sm transition-all text-slate-600 hover:text-indigo-600";
            } else {
                btnMerge.className = "flex-1 sm:flex-initial px-5 py-2.5 rounded-xl font-bold text-sm transition-all bg-indigo-600 text-white shadow-md";
                btnSplit.className = "flex-1 sm:flex-initial px-5 py-2.5 rounded-xl font-bold text-sm transition-all text-slate-600 hover:text-indigo-600";
            }
            initGame();
        }

        // --- ゲーム開始 ---
        function initGame() {
            isSolved = false;
            document.getElementById('feedback-panel').classList.add('hidden');
            
            // ランダムに左右の数を切り分ける
            leftCount = Math.floor(Math.random() * (targetNumber - 1)) + 1; // 1以上 target-1以下
            rightCount = targetNumber - leftCount;

            // クイズ形式に合わせて、どこを隠す（正解にする）か決定
            if (currentMode === 'split') {
                hidePosition = Math.random() > 0.5 ? 'left' : 'right';
                correctAnswer = (hidePosition === 'left') ? leftCount : rightCount;
            } else {
                const r = Math.random();
                if (r < 0.4) {
                    hidePosition = 'target'; // 合計
                    correctAnswer = targetNumber;
                } else if (r < 0.7) {
                    hidePosition = 'left';
                    correctAnswer = leftCount;
                } else {
                    hidePosition = 'right';
                    correctAnswer = rightCount;
                }
            }

            renderFormula();
            renderPlates();
            renderChoices();
            announceQuestion();
        }

        // --- 式の作成 ---
        function renderFormula() {
            const container = document.getElementById('formula-container');
            container.innerHTML = '';

            if (currentMode === 'split') {
                // 例：10 は [？] と 4
                container.appendChild(createNumBox(targetNumber, false));
                container.appendChild(createWordSpan('は'));
                container.appendChild(createNumBox(leftCount, hidePosition === 'left'));
                container.appendChild(createWordSpan('と'));
                container.appendChild(createNumBox(rightCount, hidePosition === 'right'));
            } else {
                // 例：6 と [？] で 10
                container.appendChild(createNumBox(leftCount, hidePosition === 'left'));
                container.appendChild(createWordSpan('と'));
                container.appendChild(createNumBox(rightCount, hidePosition === 'right'));
                container.appendChild(createWordSpan('で'));
                container.appendChild(createNumBox(targetNumber, hidePosition === 'target'));
            }
        }

        function createNumBox(value, isHidden) {
            const box = document.createElement('div');
            box.className = "flex items-center justify-center px-6 py-4 rounded-2xl min-w-[80px] h-[80px] shadow-sm font-black text-5xl transition-all duration-300";
            if (isHidden) {
                box.id = "missing-box";
                box.className += " bg-yellow-100 border-4 border-dashed border-yellow-400 text-yellow-600 animate-pulse";
                box.textContent = "？";
            } else {
                box.className += " bg-white border-2 border-slate-300 text-slate-800";
                box.textContent = value;
            }
            return box;
        }

        function createWordSpan(text) {
            const span = document.createElement('span');
            span.className = "text-xl md:text-3xl text-slate-500 font-bold mx-0.5";
            span.textContent = text;
            return span;
        }

        // --- お皿のおはじき設置（今回は固定、クリックでバウンドのみ） ---
        function renderPlates() {
            const plateLeft = document.getElementById('plate-left');
            const plateRight = document.getElementById('plate-right');

            plateLeft.innerHTML = '';
            plateRight.innerHTML = '';

            // 左：青い星（タップすると跳ねて数えやすい）
            for (let i = 0; i < leftCount; i++) {
                plateLeft.appendChild(createFixedBead('blue'));
            }

            // 右：赤いりんご（タップすると跳ねて数えやすい）
            for (let i = 0; i < rightCount; i++) {
                plateRight.appendChild(createFixedBead('red'));
            }
        }

        function createFixedBead(color) {
            const bead = document.createElement('button');
            bead.className = "w-14 h-14 md:w-16 md:h-16 flex items-center justify-center text-4xl rounded-full shadow-md transition-transform duration-100 focus:outline-none";
            
            if (color === 'blue') {
                bead.textContent = '⭐';
                bead.className += " bg-blue-100 border-2 border-blue-400 hover:bg-blue-200";
            } else {
                bead.textContent = '🍎';
                bead.className += " bg-rose-100 border-2 border-rose-400 hover:bg-rose-200";
            }

            // タップアクション：位置は変えずに、その場で跳ねるアニメーションをつけて数えやすくする
            bead.onclick = (e) => {
                playPopSound();
                bead.classList.add('pop-active');
                // アニメーションが終わったらクラスを削除
                setTimeout(() => {
                    bead.classList.remove('pop-active');
                }, 150);
            };

            return bead;
        }

        // --- 選択肢の描画 ---
        function renderChoices() {
            const container = document.getElementById('choices-container');
            container.innerHTML = '';

            for (let i = 0; i <= targetNumber; i++) {
                const btn = document.createElement('button');
                btn.className = "w-16 h-16 md:w-20 md:h-20 bg-amber-400 hover:bg-amber-500 text-slate-800 text-3xl font-extrabold rounded-2xl shadow-md border-b-4 border-amber-600 active:border-b-0 active:translate-y-1 transition-all flex items-center justify-center";
                btn.textContent = i;
                btn.onclick = () => selectAnswer(i);
                container.appendChild(btn);
            }
        }

        // --- 音声での問題読み上げ ---
        function announceQuestion() {
            let message = "";
            if (currentMode === 'split') {
                if (hidePosition === 'left') {
                    message = `${targetNumber}は、いくつと、${rightCount}かな？ おさらのおはじきを かぞえてみてね。`;
                } else {
                    message = `${targetNumber}は、${leftCount}と、いくつかな？ おさらのおはじきを かぞえてみてね。`;
                }
            } else {
                if (hidePosition === 'target') {
                    message = `${leftCount}と、${rightCount}を あわせると、いくつかな？`;
                } else if (hidePosition === 'left') {
                    message = `いくつと、${rightCount}を あわせたら、${targetNumber}に なるかな？`;
                } else {
                    message = `${leftCount}と、いくつを あわせたら、${targetNumber}に なるかな？`;
                }
            }
            speakText(message);
        }

        // --- 答え合わせ ---
        function selectAnswer(num) {
            if (isSolved) return;

            if (num === correctAnswer) {
                handleCorrect();
            } else {
                handleIncorrect();
            }
        }

        function handleCorrect() {
            isSolved = true;
            playSuccessSound();

            const missingBox = document.getElementById('missing-box');
            if (missingBox) {
                missingBox.textContent = correctAnswer;
                missingBox.className = "flex items-center justify-center px-6 py-4 rounded-2xl min-w-[80px] h-[80px] shadow-sm font-black text-5xl bg-emerald-100 border-4 border-emerald-400 text-emerald-600";
            }

            const feedbackPanel = document.getElementById('feedback-panel');
            const feedbackText = document.getElementById('feedback-text');
            feedbackPanel.classList.remove('hidden');

            let congratulationText = "";
            if (currentMode === 'split') {
                congratulationText = `せいかい！ ${targetNumber} は ${leftCount} と ${rightCount} だね！すごい！`;
            } else {
                congratulationText = `せいかい！ ${leftCount} と ${rightCount} を あわせると ${targetNumber} だね！素晴らしい！`;
            }

            feedbackText.textContent = `🎉 せいかい！ ${leftCount} と ${rightCount} で ${targetNumber}！ 🎉`;
            speakText(congratulationText);

            setTimeout(() => {
                initGame();
            }, 3500);
        }

        function handleIncorrect() {
            playWrongSound();
            speakText("ちがうよ、お皿のおはじきをもう一回かぞえてみてね");
            
            const missingBox = document.getElementById('missing-box');
            if (missingBox) {
                missingBox.classList.add('bg-rose-100', 'border-rose-400', 'text-rose-600');
                setTimeout(() => {
                    missingBox.classList.remove('bg-rose-100', 'border-rose-400', 'text-rose-600');
                }, 800);
            }
        }

        // --- 最大化（フルスクリーン）の制御 ---
        function toggleFullscreen() {
            const fsText = document.getElementById('fs-text');
            const fsIcon = document.getElementById('fs-icon');
            
            if (!document.fullscreenElement) {
                // フルスクリーンにする
                if (!document.documentElement.requestFullscreen) {
                    fsText.textContent = "この端末は全画面表示に未対応です";
                    return;
                }
                document.documentElement.requestFullscreen().then(() => {
                    fsText.textContent = "画面を元に戻す";
                    fsIcon.textContent = "📴";
                }).catch(err => {
                    console.log("フルスクリーンエラー:", err);
                });
            } else {
                // フルスクリーンを解除する
                document.exitFullscreen().then(() => {
                    fsText.textContent = "がめんを おおきくする";
                    fsIcon.textContent = "🖥️";
                });
            }
        }
        document.addEventListener('fullscreenchange', () => {
            document.getElementById('fs-text').textContent = document.fullscreenElement
                ? "画面を元に戻す" : "がめんを おおきくする";
            document.getElementById('fs-icon').textContent = document.fullscreenElement ? "📴" : "🖥️";
        });
    </script>
</body>
</html>
